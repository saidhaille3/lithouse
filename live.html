<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenlight Sports Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <style>
        /* --- CORE PAGE STYLES --- */
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #111111; transition: background-color 0.4s ease; overflow-x: hidden; }
        .dark body { background-color: #0a0a0a; color: #f4f4f4; }
        .fire-text { background: linear-gradient(135deg, #062c06 0%, #0a4d0a 35%, #d4af37 65%, #926f12 100%); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 900; }
        .ios-glass { background: rgba(0, 0, 0, 0.03); backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(0, 0, 0, 0.08); shadow: inset 0 1px 1px rgba(255,255,255,0.8); }
        .dark .ios-glass { background: rgba(255, 255, 255, 0.03); border-color: rgba(255, 255, 255, 0.1); }

        /* --- MEDIA PLAYER ELITE STYLING --- */
        mux-player {
            --media-button-icon-filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            --media-range-thumb-background: #d4af37;
            --media-range-bar-color: #10b981;
            --media-control-background: rgba(0, 0, 0, 0.6);
            --primary-color: #d4af37;
            border-radius: 2rem;
            overflow: hidden;
        }

        /* 1. FORCE HIDE THE NATIVE BROWSER PLAY BUTTON (Conflicting icon) */
        mux-player video::-webkit-media-controls { display:none !important; }
        mux-player video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }

        /* 2. CUSTOM FLOATING CONTROL BAR (The 'Lounge' Look) */
        mux-player::part(controls-container) {
            padding: 15px;
        }

        mux-player::part(control-bar) {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            border: 1px solid rgba(212, 175, 55, 0.3); /* Subtle gold border */
            margin-bottom: 10px;
            padding: 0 10px;
        }

        /* Center Play Button Fix */
        mux-player::part(play-button) { color: #d4af37; transform: scale(1.2); }
    </style>
</head>

<body class="antialiased overflow-x-hidden">

<nav id="navbar" class="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center bg-white/80 dark:bg-black/80 backdrop-blur-md">
    <div class="flex items-center gap-2">
        <span class="fire-text text-xl">Greenlight</span>
    </div>
    <div class="flex items-center gap-4">
        <button onclick="document.documentElement.classList.toggle('dark')" class="text-amber-500"><i class="fa-solid fa-moon text-xl"></i></button>
    </div>
</nav>

<section class="mt-24 px-4 md:px-8 max-w-5xl mx-auto">
    <div class="group relative bg-black rounded-[2.5rem] overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-white/5">
        
<mux-player
    stream-type="live"
    playback-id="TewjpLNLyv802huM3gVvXv4Nzs8XAUgdZXQ502NYQusmk"
    metadata-video-title="Live Stream: Greenlight Sports"
    class="w-full aspect-video"
    primary-color="#d4af37"
    prefer-mse
    playsinline
></mux-player>

        <div class="absolute top-6 left-6 pointer-events-none">
            <div class="flex items-center gap-2 bg-red-600 px-3 py-1 rounded-full shadow-lg">
                <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span>
                <span class="text-[10px] font-black uppercase tracking-widest text-white">Live</span>
            </div>
        </div>
    </div>

    <div class="mt-6 flex justify-between items-center px-2">
        <div class="flex gap-4">
            <button class="flex items-center gap-2 text-xs font-black uppercase tracking-widest dark:text-white group">
                <div class="w-10 h-10 rounded-full ios-glass flex items-center justify-center group-hover:bg-amber-500 transition-all">
                    <i class="fa-solid fa-share-nodes"></i>
                </div>
                Share
            </button>
            <button class="flex items-center gap-2 text-xs font-black uppercase tracking-widest dark:text-white group">
                <div class="w-10 h-10 rounded-full ios-glass flex items-center justify-center group-hover:bg-red-600 transition-all">
                    <i class="fa-solid fa-heart"></i>
                </div>
                Favorite
            </button>
        </div>
        <div class="text-right">
            <p class="text-[10px] font-black uppercase opacity-40 dark:text-white tracking-[0.2em]">Current Viewers</p>
            <p class="text-xl font-black dark:text-white tracking-tighter">12,402</p>
        </div>
    </div>
</section>

<div id="modalBg" class="fixed inset-0 z-[200] flex items-center justify-center p-5 bg-black/60 backdrop-blur-sm">
  <div class="ios-glass w-full max-w-sm rounded-[2.5rem] p-10 text-center shadow-2xl bg-white dark:bg-neutral-900">
      <h2 class="text-3xl font-black uppercase tracking-tighter dark:text-white mb-2">Join Stream</h2>
      <p class="text-xs opacity-50 uppercase tracking-widest mb-8">Enter name to enter the lounge</p>
      <input type="text" id="nameInput" placeholder="YOUR NAME" class="w-full bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-2xl px-6 py-4 mb-4 outline-none focus:border-amber-500 transition-all dark:text-white" />
      <button onclick="setUsername()" class="w-full bg-black dark:bg-white dark:text-black text-white py-5 rounded-2xl font-black uppercase tracking-widest hover:scale-105 active:scale-95 transition-all">Start Watching →</button>
  </div>
</div>

<script>
    function setUsername() {
        const name = document.getElementById('nameInput').value;
        if(name.trim().length > 1) {
            document.getElementById('modalBg').classList.add('hidden');
        }
    }

    // Enter Key Support
    document.getElementById('nameInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') setUsername();
    });
</script>
<style>
    /* 1. Target the internal video element specifically */
mux-player::part(video) {
    -webkit-media-controls: none !important;
    -webkit-media-controls-enclosure: none !important;
    display: block;
}

/* 2. Target the specific 'Big Play Button' Safari injects */
mux-player video::-webkit-media-controls-overlay-play-button {
    display: none !important;
    -webkit-appearance: none;
}

/* 3. Ensure the Mux controls are the ONLY ones visible */
mux-player::part(controls-container) {
    z-index: 10;
}

</style>
</body>
</html>
